{{- if .Values.probo.tracing.flowlines.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "probo.flowlinesCollectorName" . }}
  labels:
    {{- include "probo.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 127.0.0.1:4318

    processors:
      batch: {}

    exporters:
      otlp_http/flowlines:
        traces_endpoint: {{ required "probo.tracing.flowlines.tracesEndpoint is required when Flowlines tracing is enabled" .Values.probo.tracing.flowlines.tracesEndpoint | quote }}
        headers:
          x-flowlines-api-key: "${env:FLOWLINES_API_KEY}"

    service:
      pipelines:
        traces:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - otlp_http/flowlines
{{- end }}
